services:
  - type: web
    name: life-planner
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL
        value: https://muzkjlwstmeodcoxtqlx.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: WEBAPP_SHORT_NAME
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: TICK_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
